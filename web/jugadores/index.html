<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>¿Quién juega?</title>
<link rel="icon" href="../comun/icono.png">
<link rel="stylesheet" href="../comun/estilo.css">
<style>
  body { background: linear-gradient(#7fd0ff, #c9f0c0 70%, #fff0b3); }
  #vistas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  h1 { position: absolute; top: 30px; left: 0; right: 0; margin: 0; text-align: center; font-size: 104px; color: var(--morado);
    -webkit-text-stroke: 22px #fff; paint-order: stroke fill; }
  #huecos { position: absolute; top: 190px; left: 0; right: 0; display: flex; justify-content: center; gap: 36px; }
  .hueco { position: relative; width: 430px; height: 780px; border-radius: 48px; background: rgba(255,255,255,.72);
    box-shadow: 0 14px 0 rgba(60,30,110,.1), 0 22px 40px rgba(60,30,110,.12); display: flex; flex-direction: column; align-items: center;
    border: 8px solid transparent; transition: border-color .2s, transform .2s; overflow: hidden; }
  .hueco.activo { border-color: var(--c); background: rgba(255,255,255,.88); }
  .hueco.listo { transform: translateY(-10px); }
  .cab { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 0; font-size: 30px; color: #5a4a7a; }
  .num { background: var(--c); color: #fff; padding: 6px 18px; border-radius: 999px; }
  .disp { font-size: 24px; opacity: .8; }
  .vista { width: 100%; height: 290px; flex: none; position: relative; }
  .vacio-ico { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%;
    border: 8px dashed rgba(123,63,228,.35); display: grid; place-items: center; font-size: 120px; color: rgba(123,63,228,.4); }
  .nombre { font-size: 58px; color: var(--morado); line-height: 1.1; min-height: 64px; text-align: center; padding: 0 20px; white-space: nowrap; }
  .nombre .flecha { color: var(--c); padding: 0 14px; }
  .sub { font-size: 30px; color: #7a6a9a; margin-top: 4px; }
  .ocupado { color: #ff4d6d; }
  .cuerpo { width: 100%; padding: 14px 26px 0; flex: 1; display: flex; flex-direction: column; align-items: center; }
  .pistas { margin-top: auto; padding-bottom: 26px; font-size: 26px; color: #6a5a8a; text-align: center; line-height: 1.7; }
  .pistas .boton-a { font-size: 24px; }
  [data-accion], .tecla, .fila, .hueco { cursor: pointer; }
  .pistas [data-accion] { padding: 2px 10px; border-radius: 999px; }
  .pistas [data-accion]:active { background: rgba(123,63,228,.12); }
  .pulsa { font-size: 40px; color: #5a4a7a; text-align: center; margin-top: 30px; animation: late 1.2s ease-in-out infinite alternate; }
  @keyframes late { to { transform: scale(1.06); } }
  .listo-badge { margin-top: 26px; font-size: 64px; color: #fff; background: var(--c); padding: 10px 40px; border-radius: 999px;
    box-shadow: 0 8px 0 rgba(0,0,0,.12); animation: late .5s ease-in-out infinite alternate; }
  .filas { width: 100%; }
  .fila { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #5a4a7a; padding: 7px 16px; border-radius: 16px; white-space: nowrap; }
  .hueco.editando .vista { height: 200px; }
  .hueco.editando .nombre { font-size: 44px; min-height: 48px; }
  .hueco.editando .sub { display: none; }
  .hueco.editando .cuerpo { padding-top: 6px; }
  .fila b { color: var(--morado); font-weight: 700; }
  .fila.sel { background: var(--c); color: #fff; }
  .fila.sel b { color: #fff; }
  .muestra { display: inline-block; width: 30px; height: 30px; border-radius: 50%; border: 4px solid #fff; vertical-align: -6px; box-shadow: 0 0 0 2px rgba(0,0,0,.1); }
  .guardar { justify-content: center; margin-top: 8px; background: rgba(123,63,228,.1); }
  .teclado { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
  .tecla { height: 52px; border-radius: 12px; background: #fff; display: grid; place-items: center; font-size: 28px; color: #5a4a7a; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .tecla.sel { background: var(--c); color: #fff; transform: scale(1.08); }
  .tecla.ancha3 { grid-column: span 3; } .tecla.ancha4 { grid-column: span 4; }
  .espacio { width: 40px; height: 10px; border: 4px solid currentColor; border-top: none; border-radius: 0 0 6px 6px; }
  .campo { font-size: 44px; color: var(--morado); background: #fff; border-radius: 16px; padding: 4px 18px; margin-bottom: 12px; min-width: 300px; text-align: center; }
  .campo i { display: inline-block; width: 4px; height: 40px; background: var(--c); vertical-align: -6px; animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  #pie { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 40px; color: var(--morado); -webkit-text-stroke: 10px #fff; paint-order: stroke fill; }
  #pie.todos { color: #fff; -webkit-text-stroke-color: #3dbb4c; animation: late .6s ease-in-out infinite alternate; }
</style>
</head>
<body>
<div class="escenario" id="esc">
  <h1>¿Quién juega?</h1>
  <div id="huecos"></div>
  <div id="pie"></div>
</div>
<canvas id="vistas"></canvas>
<script type="module" src="jugadores.js"></script>
</body>
</html>
