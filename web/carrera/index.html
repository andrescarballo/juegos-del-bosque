<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La gran carrera</title>
<link rel="icon" href="../comun/icono.png">
<link rel="stylesheet" href="../comun/estilo.css">
<style>
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { pointer-events: none; }
  #esc { z-index: 10; }
  #panel .opciones > span { pointer-events: auto; cursor: pointer; padding: 10px 18px; border-radius: 999px; }
  #panel .opciones > span:active { background: rgba(123,63,228,.12); }
  .txt { color: #fff; -webkit-text-stroke: 14px var(--morado); paint-order: stroke fill; }

  #marcador { position: absolute; top: 26px; left: 40px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .chip { display: inline-flex; align-items: center; gap: 12px; background: rgba(255,255,255,.9); color: #4a3b6a; font-size: 34px;
    padding: 6px 22px 6px 12px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.08); white-space: nowrap; }
  .chip i { width: 24px; height: 24px; border-radius: 50%; background: var(--c); flex: none; }
  .chip b { color: var(--c); min-width: 2ch; }
  .chip .vidas { color: #ff4d6d; letter-spacing: -4px; font-size: 30px; }
  .chip .poder { font-size: 30px; }
  .chip.fuera { opacity: .5; }
  .chip.grande { font-size: 46px; }
  .tabla { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin: 12px 0 6px; }

  #arriba { position: absolute; top: 22px; left: 0; right: 0; text-align: center; }
  #nivel { font-size: 54px; -webkit-text-stroke-width: 12px; }
  #tiempo { display: block; font-size: 84px; line-height: 1; margin-top: 2px; transition: transform .15s; }
  #tiempo.prisa { color: #ffe066; animation: late .5s ease-in-out infinite alternate; }
  #record { position: absolute; top: 34px; right: 50px; font-size: 42px; -webkit-text-stroke-width: 11px; text-align: right; }
  #total { display: block; font-size: 58px; }

  .etiqueta { position: absolute; transform: translate(-50%, -100%); font-size: 3.6vmin; color: #fff; white-space: nowrap;
    -webkit-text-stroke: 1vmin var(--c); paint-order: stroke fill; }
  #mensaje { position: absolute; top: 360px; left: 0; right: 0; text-align: center; font-size: 120px; opacity: 0; transform: scale(.6); transition: all .25s cubic-bezier(.3,1.6,.5,1); }
  #mensaje.ver { opacity: 1; transform: scale(1); }
  #mensaje small { display: block; font-size: 56px; -webkit-text-stroke-width: 10px; }
  #ayuda { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 34px; color: #4a3b6a; transition: opacity 1s; }
  #ayuda > span { background: rgba(255,255,255,.85); padding: 12px 30px; border-radius: 999px; }
  #panel {
    position: absolute; left: 50%; top: 50%; width: 1100px; padding: 50px 60px 56px;
    transform: translate(-50%, -50%) scale(.8); opacity: 0; transition: all .25s cubic-bezier(.3,1.5,.5,1);
    background: rgba(255,255,255,.95); border-radius: 64px; text-align: center; color: var(--morado);
    box-shadow: 0 18px 0 rgba(90,40,140,.15), 0 30px 60px rgba(90,40,140,.25);
  }
  #panel.ver { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #panel h2 { margin: 0 0 18px; font-size: 84px; line-height: 1; }
  #panel p { margin: 10px 0; font-size: 50px; color: #5a4a7a; }
  #panel .nuevo { color: var(--rosa); font-size: 64px; animation: late .6s ease-in-out infinite alternate; }
  @keyframes late { to { transform: scale(1.08); } }
  #panel .opciones { margin-top: 30px; font-size: 44px; display: flex; justify-content: center; gap: 36px; color: #5a4a7a; white-space: nowrap; }
  #flotantes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .mas1 { position: absolute; font-size: 6vmin; transform: translate(-50%, -50%); animation: sube 0.9s ease-out forwards; }
  @keyframes sube { to { transform: translate(-50%, -170%) scale(1.2); opacity: 0; } }
  #fps { position: absolute; bottom: 20px; right: 30px; font: 500 28px ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.35); padding: 4px 14px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="flotantes" class="hud"></div>
<div class="escenario hud" id="esc">
  <div id="marcador"></div>
  <div id="arriba" class="txt"><span id="nivel">Vuelta 1 de 3</span><b id="tiempo">0:00</b></div>
  <div id="record" class="txt"></div>
  <div id="mensaje" class="txt"></div>
  <div id="ayuda"><span>Stick: correr · <span class="boton-a">A</span> saltar · <span class="boton-a" style="background:#3aa0ff">X</span> usar objeto · <span class="boton-a" style="background:#ffc531">Y</span> especial · <span class="boton-a boton-start">Menú</span> pausa</span></div>
  <div id="panel"></div>
  <div id="fps"></div>
</div>
<script type="module" src="juego.js"></script>
</body>
</html>
