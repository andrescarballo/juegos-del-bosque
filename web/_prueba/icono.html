<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Icono</title>
<link rel="stylesheet" href="../comun/estilo.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#5fbdff, #bfe8ff 55%, #ffe9f6 75%); }
  svg, canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1 { position: fixed; left: 0; right: 0; top: 4vh; margin: 0; text-align: center; font-size: 21vh; line-height: .95; color: #7b3fe4; -webkit-text-stroke: 4.4vh #fff; paint-order: stroke fill; display: none; }
  body.banner h1 { display: block; }
</style></head>
<body>
<svg id="arco" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"></svg>
<canvas id="c"></canvas>
<h1 id="nombreApp">Juegos del bosque</h1>
<script type="module">
// El icono de la app (cuadrado) y el cartel de la tele (?banner, 16:9), hechos con los animales de verdad.
// Se capturan con el navegador y se guardan en comun/icono.png y app/res/.
import * as THREE from '../lib/three.min.js';
import { crearPersonaje, animarPersonaje } from '../comun/personajes.js';
const banner = new URLSearchParams(location.search).has('banner');
document.body.classList.toggle('banner', banner);
const otroNombre = new URLSearchParams(location.search).get('nombre');   // ?nombre=… para un cartel con otro nombre
if (otroNombre) document.getElementById('nombreApp').textContent = otroNombre;
const ARCO = ['#ff5d73', '#ff9f43', '#ffd93d', '#6bd968', '#4cc3ff', '#7b7bff', '#c17bff'];
document.getElementById('arco').innerHTML = ARCO.map((c, i) => `<circle cx="50" cy="${banner ? 96 : 84}" r="${(banner ? 62 : 56) - i * 3.4}" fill="none" stroke="${c}" stroke-width="3.5"/>`).join('');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight, false);
const e = new THREE.Scene();
e.add(new THREE.HemisphereLight('#f2f9ff', '#a6dd84', 2.0));
const sol = new THREE.DirectionalLight('#fff0dc', 2.3); sol.position.set(-3, 6, 5); e.add(sol);
const suelo = new THREE.Mesh(new THREE.SphereGeometry(30, 48, 24), new THREE.MeshLambertMaterial({ color: '#7fd65a' }));
suelo.position.set(0, -30, -1.5); e.add(suelo);
const cam = new THREE.PerspectiveCamera(banner ? 24 : 30, innerWidth / innerHeight, 0.1, 100);
// quién sale: [animal, x, z, giro, accesorio]
const QUIEN = banner
  ? [['oveja', -3.3, 0, 0.5, 'nada'], ['zorro', -1.75, 0.5, 0.35, 'nada'], ['conejo', -0.6, 0.9, 0.15, 'nada'], ['ardilla', 0.6, 0.9, -0.15, 'nada'], ['buho', 1.75, 0.5, -0.3, 'nada'], ['oso', 3.3, 0, -0.5, 'nada']]
  : [['oveja', -1.05, -0.2, 0.45, 'nada'], ['zorro', 0, 0.55, 0, 'corona'], ['oso', 1.1, -0.3, -0.45, 'nada']];
const pjs = QUIEN.map(([animal, x, z, giro, accesorio]) => { const p = crearPersonaje(THREE, { animal, accesorio, color: '#ff4d6d' }); p.g.position.set(x, -0.02, z); p.g.rotation.y = giro; e.add(p.g); return p; });
for (let i = 0; i < 40; i++) for (const p of pjs) animarPersonaje(p, { suelo: true, dt: 1 / 60 });
if (banner) { cam.position.set(0, 1.0, 11.5); cam.lookAt(0, 1.55, 0); } else { cam.position.set(0, 1.3, 5.3); cam.lookAt(0, 1.0, 0); }
const pinta = () => { r.render(e, cam); requestAnimationFrame(pinta); };
pinta();
</script>
</body></html>
