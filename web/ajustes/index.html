<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ajustes</title>
<link rel="icon" href="../comun/icono.png">
<link rel="stylesheet" href="../comun/estilo.css">
<style>
  body { background: linear-gradient(#bfe3ff, #f3e6ff 60%, #fff4cc); }
  h1 { position: absolute; top: 60px; left: 120px; margin: 0; font-size: 110px; color: var(--morado); -webkit-text-stroke: 22px #fff; paint-order: stroke fill; }
  #opciones { position: absolute; top: 236px; left: 120px; width: 800px; display: flex; flex-direction: column; gap: 22px; }
  .op { display: flex; align-items: center; gap: 30px; background: var(--c); color: #fff; border-radius: 40px; padding: 18px 36px;
    font-size: 46px; text-decoration: none; box-shadow: 0 12px 0 rgba(0,0,0,.12); transition: transform .15s cubic-bezier(.3,1.6,.5,1); cursor: pointer;
    -webkit-text-stroke: 10px var(--oscuro); paint-order: stroke fill; }
  .op span.i { font-size: 70px; -webkit-text-stroke: 0; }
  .op.sel { transform: scale(1.05); box-shadow: 0 0 0 12px #fff, 0 0 0 20px rgba(255,255,255,.4), 0 20px 40px rgba(80,30,120,.25); }
  #lista { position: absolute; top: 280px; left: 980px; width: 820px; background: rgba(255,255,255,.9); border-radius: 44px; padding: 40px 50px;
    color: #4a3b6a; box-shadow: 0 12px 0 rgba(90,40,140,.12); }
  #lista h2 { margin: 0 0 20px; font-size: 50px; color: var(--morado); }
  #lista ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; font-size: 40px; }
  #lista li { display: flex; align-items: center; gap: 18px; }
  #lista li i { width: 22px; height: 22px; border-radius: 50%; background: #3dbb4c; box-shadow: 0 0 0 6px rgba(61,187,76,.2); flex: none; }
  #lista .nada { color: #9a8db3; }
  #lista small { display: block; margin-top: 26px; font-size: 30px; color: #7a6a9a; line-height: 1.35; }
  #pie { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 40px; color: var(--morado); -webkit-text-stroke: 10px #fff; paint-order: stroke fill; }
</style>
</head>
<body>
<div class="escenario" id="esc">
  <h1>Ajustes</h1>
  <div id="opciones">
    <a class="op" href="../mando/index.html" style="--c:#ffad3b;--oscuro:#b0640a"><span class="i">🎮</span>Probar el mando</a>
    <a class="op" href="#" data-ajuste="musica" style="--c:#ff6fae;--oscuro:#b02d6c"><span class="i">🎵</span><span id="txtMusica">Música</span></a>
    <a class="op" href="#" data-ajuste="estacion" style="--c:#52c97a;--oscuro:#227a45"><span class="i" id="icoEstacion">🍂</span><span id="txtEstacion">Estación</span></a>
    <a class="op" href="#" data-ajuste="efectos" style="--c:#3fb6f5;--oscuro:#1b6fa8"><span class="i">🌦️</span><span id="txtEfectos">Efectos</span></a>
    <a class="op" href="../index.html" data-volver="1" style="--c:#8f6bff;--oscuro:#4f2fb0"><span class="i">⬅️</span>Volver al menú</a>
  </div>
  <div id="lista"><h2>Conectados ahora</h2><ul id="disp"></ul>
    <small>Los mandos de Xbox se emparejan en los ajustes de la tele (Mandos y accesorios). El móvil se conecta con el QR del menú.</small></div>
  <div id="pie">Elige con la cruceta y pulsa <span class="boton-a">A</span> · <span class="boton-a boton-b">B</span> volver</div>
</div>
<script type="module">
import { pad, entradas } from '../comun/pad.js';
import { suena } from '../comun/sonido.js';
import { escenario, volverAlMenu, alPulsarAtras } from '../comun/tv.js';
import { musicaActiva, ponerMusica } from '../comun/musica.js';
import { ESTACIONES, ICONOS, modoEstacion, ponerModoEstacion, estacionActual, EFECTOS, modoEfectos, ponerModoEfectos } from '../comun/estaciones.js';

// Música sí/no y qué estación hay en los juegos
const MODOS = ['rota', 'calendario', '0', '1', '2', '3'];
function pintarAjustes() {
  document.getElementById('txtMusica').textContent = 'Música: ' + (musicaActiva() ? 'sí' : 'no');
  const m = modoEstacion(), e = estacionActual();
  document.getElementById('txtEstacion').textContent = m === 'rota' ? 'Estación: va cambiando' : m === 'calendario' ? 'Estación: la de hoy' : 'Estación: ' + ESTACIONES[+m].toLowerCase();
  document.getElementById('txtEfectos').textContent = 'Efectos: ' + { no: 'ninguno', suave: 'suaves', fuerte: 'exagerados' }[modoEfectos()];
  document.getElementById('icoEstacion').textContent = m === 'rota' ? '🔄' : ICONOS[e];
}
function cambiarAjuste(cual) {
  if (cual === 'musica') ponerMusica(!musicaActiva());
  else if (cual === 'efectos') ponerModoEfectos(EFECTOS[(EFECTOS.indexOf(modoEfectos()) + 1) % EFECTOS.length]);
  else ponerModoEstacion(MODOS[(MODOS.indexOf(modoEstacion()) + 1) % MODOS.length]);
  pintarAjustes();
}

escenario(document.getElementById('esc'));
alPulsarAtras(() => { volverAlMenu(); return true; });
const ops = [...document.querySelectorAll('.op')];
let sel = 0;
function elegir(i) {
  i = Math.max(0, Math.min(ops.length - 1, i));
  if (i !== sel) suena('mover');
  sel = i;
  ops.forEach((o, k) => o.classList.toggle('sel', k === sel));
}
function abrir() {
  const o = ops[sel];
  suena('elegir');
  if (o.dataset.ajuste) cambiarAjuste(o.dataset.ajuste);
  else if (o.dataset.volver) volverAlMenu();
  else setTimeout(() => { location.href = o.href; }, 150);
}
ops.forEach((o, i) => {
  o.addEventListener('mouseenter', () => elegir(i));
  o.addEventListener('click', (e) => { e.preventDefault(); elegir(i); abrir(); });
});
elegir(0);
pintarAjustes();

const ul = document.getElementById('disp');
let ultimo = '';
function pintarLista() {
  const ds = entradas.lista();
  const html = ds.length
    ? ds.map((d) => `<li><i></i>${d.tipo === 'movil' ? '📱' : d.tipo === 'teclado' ? '⌨️' : d.tipo === 'tactil' ? '👆' : '🎮'} ${String(d.etiqueta || d.nombre || 'Mando').replace(/[<>&]/g, '')}</li>`).join('')
    : '<li class="nada">Ningún mando conectado</li>';
  if (html !== ultimo) { ul.innerHTML = html; ultimo = html; }
}
function bucle(now) {
  pad.update();
  entradas.update();
  const d = pad.nav(now);
  if (d === 'up') elegir(sel - 1);
  if (d === 'down') elegir(sel + 1);
  if (pad.pressed('A')) abrir();
  else if (pad.pressed('B')) volverAlMenu();
  pintarLista();
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
</script>
</body>
</html>
